[package]
name = "p7-route-c"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
smplx-std = "0.0.5"
lending-contracts = { path = "../../../../../crates/contracts" }
private-lending-core = { path = "../../../../../crates/private-lending-core" }
k256 = { version = "=0.13.4", default-features = false, features = ["arithmetic", "expose-field"] }
sha2 = { version = "0.10", features = ["compress"] }
rand = "0.8"
serde_json = "1"
anyhow = "1"

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 2
