[package]
name = "private-lending-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "WebAssembly module for Simplicity Lending private offers, used by the web app"
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
elements = { version = "0.25.2", features = ["base64", "json-contract"] }
getrandom = { version = "0.2", features = ["js"] }
private-lending-core = { path = "../private-lending-core" }
rand = "0.8"
wasm-bindgen = "0.2"

[dev-dependencies]
lending-contracts = { path = "../contracts" }
serde_json = "1"
smplx-std = { workspace = true }
